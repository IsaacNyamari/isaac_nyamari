<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" role="img" aria-label="Isaac Nyamari">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5C861"/>
      <stop offset="1" stop-color="#D9952B"/>
    </linearGradient>
  </defs>

  <rect width="680" height="200" fill="#0B1222"/>

  <!-- Monogram on dark: outlined tile -->
  <rect x="21.5" y="21.5" width="157" height="157" rx="37" fill="#16213D" stroke="#2C3B63" stroke-width="3"/>
  <polygon points="58,56 81,56 142,144 119,144" fill="#FFFFFF"/>
  <rect x="119" y="56" width="23" height="88" rx="3" fill="#FFFFFF"/>
  <rect x="58" y="56" width="23" height="88" rx="3" fill="url(#gold)"/>

  <text x="212" y="112" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" letter-spacing="5" fill="#FFFFFF">
    <tspan font-weight="800">ISAAC</tspan><tspan font-weight="300" dx="14">NYAMARI</tspan>
  </text>
  <rect x="214" y="132" width="56" height="5" rx="2.5" fill="url(#gold)"/>
